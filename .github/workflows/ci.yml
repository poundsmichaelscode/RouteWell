
name: CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret-that-is-more-than-32-characters
      JWT_REFRESH_SECRET: test-refresh-secret-that-is-more-than-32-characters
      FRONTEND_URL: http://localhost:3000
      ALLOW_PUBLIC_REGISTRATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate OpenAPI
        run: npm run swagger:check

      - name: Compile TypeScript
        run: npm run build

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_ALLOW_REGISTRATION: "true"
      BACKEND_INTERNAL_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Terraform format
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive

      - name: Terraform initialize without backend
        run: |
          terraform \
            -chdir=infrastructure/terraform \
            init \
            -backend=false \
            -input=false

      - name: Terraform validate
        run: terraform -chdir=infrastructure/terraform validate

      - name: Validate Docker Compose
        env:
          SEED_ADMIN_PASSWORD: CI-RouteWell-Admin-Password-2026
          SEED_DRIVER_PASSWORD: CI-RouteWell-Driver-Password-2026
        run: |
          set -euo pipefail

          cp .env.example .env
          trap 'rm -f .env' EXIT

          docker compose config --quiet

  docker:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    needs:
      - backend
      - frontend

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: routewell-backend:ci
          cache-from: type=gha,scope=routewell-backend
          cache-to: type=gha,mode=max,scope=routewell-backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: routewell-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            NEXT_PUBLIC_ALLOW_REGISTRATION=true
          cache-from: type=gha,scope=routewell-frontend
          cache-to: type=gha,mode=max,scope=routewell-frontend

