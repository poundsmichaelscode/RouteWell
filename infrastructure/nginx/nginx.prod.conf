user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time","request_id":"$request_id"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  upstream frontend { server frontend:3000; keepalive 32; }
  server {
    listen 80 default_server;
    server_name _;
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://frontend; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id; }
    location / { proxy_pass http://frontend; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id; }
  }
}
