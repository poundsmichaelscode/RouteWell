#cloud-config
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - jq
  - unzip
  - nginx
write_files:
  - path: /etc/routewell-tier
    permissions: '0644'
    content: ${tier}
  - path: /etc/docker/daemon.json
    permissions: '0644'
    content: |
      {"log-driver":"journald","live-restore":true,"no-new-privileges":true}
  - path: /etc/sysctl.d/99-routewell.conf
    permissions: '0644'
    content: |
      net.ipv4.tcp_syncookies=1
      net.ipv4.conf.all.accept_redirects=0
      net.ipv4.conf.default.accept_redirects=0
      net.ipv4.conf.all.send_redirects=0
      net.ipv4.conf.default.send_redirects=0
runcmd:
  - [ sh, -c, "install -m 0755 -d /etc/apt/keyrings" ]
  - [ sh, -c, "curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc" ]
  - [ sh, -c, "chmod a+r /etc/apt/keyrings/docker.asc" ]
  - [ sh, -c, 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list' ]
  - [ sh, -c, "apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin" ]
  - [ sh, -c, "curl -sL https://aka.ms/InstallAzureCLIDeb | bash" ]
  - [ sh, -c, "usermod -aG docker ${admin_username} || true" ]
  - [ sh, -c, "mkdir -p /opt/routewell /opt/routewell/secrets && chmod 700 /opt/routewell/secrets" ]
  - [ sh, -c, "systemctl enable --now docker" ]
  - [ sh, -c, "sysctl --system" ]
